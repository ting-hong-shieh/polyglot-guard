<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">PolyglotGuard</title>
  <desc id="desc">An editorial translation-drift review spread</desc>
  <defs>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".55" fill="#251f1a" opacity=".06"/></pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="4"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#f5efe2"/>
    <rect width="1200" height="360" fill="url(#paper)"/>
    <rect x="0" y="0" width="1200" height="12" fill="#1e3a5f"/>
    <rect x="0" y="348" width="1200" height="12" fill="#e14c3b"/>

    <g transform="translate(58 44)">
      <text x="0" y="18" fill="#e14c3b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800" letter-spacing="2.6">EDITORIAL PROOF / TRANSLATION DRIFT</text>
      <text x="0" y="111" fill="#251f1a" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" letter-spacing="-3">Polyglot</text>
      <text x="0" y="177" fill="#1e3a5f" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">GUARD</text>
      <text x="2" y="218" fill="#655d54" font-family="Arial, Helvetica, sans-serif" font-size="19">Know what changed before translation review begins.</text>
      <g transform="translate(0 246)">
        <rect width="178" height="30" fill="none" stroke="#e14c3b" stroke-width="2"/>
        <text x="89" y="20" fill="#e14c3b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.5">DESIGN DRAFT / v0.1</text>
      </g>
    </g>

    <g transform="translate(550 42)">
      <g>
        <rect width="264" height="270" fill="#fffdf6" stroke="#cabfaf"/>
        <text x="22" y="30" fill="#1e3a5f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="800" letter-spacing="1.8">SOURCE / BASELINE → HEAD</text>
        <text x="22" y="72" fill="#251f1a" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">Installation</text>
        <path d="M22 90H226M22 108H198M22 126H232" stroke="#a89d90" stroke-width="6"/>
        <text x="22" y="170" fill="#251f1a" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">Configuration</text>
        <path d="M22 188H218M22 206H238M22 224H164" stroke="#a89d90" stroke-width="6"/>
        <path d="M14 136H244" stroke="#e14c3b" stroke-width="3"/>
        <text x="206" y="151" fill="#e14c3b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="800">MODIFIED</text>
      </g>
      <g transform="translate(306 18) rotate(2 132 135)">
        <rect width="264" height="270" fill="#fbf7ed" stroke="#cabfaf"/>
        <text x="22" y="30" fill="#1e3a5f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="800" letter-spacing="1.8">TRANSLATION / REVIEW</text>
        <text x="22" y="74" fill="#251f1a" font-family="Georgia, 'Noto Serif CJK TC', serif" font-size="23" font-weight="700">安裝方式</text>
        <path d="M22 94H230M22 112H188M22 130H220" stroke="#a89d90" stroke-width="6"/>
        <text x="22" y="174" fill="#251f1a" font-family="Georgia, 'Noto Serif CJK TC', serif" font-size="23" font-weight="700">設定</text>
        <path d="M22 194H214M22 212H238M22 230H175" stroke="#a89d90" stroke-width="6"/>
        <path d="M12 144C62 124 110 166 164 139S232 150 248 132" fill="none" stroke="#2764b0" stroke-width="4"/>
        <path d="M221 119L248 132 228 151" fill="none" stroke="#2764b0" stroke-width="4"/>
        <text x="155" y="259" fill="#2764b0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="800">HUMAN REVIEW →</text>
      </g>
      <circle cx="282" cy="139" r="34" fill="#1e3a5f"/>
      <text x="282" y="146" fill="#fffdf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="900" text-anchor="middle">DIFF</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">PolyglotGuard</title>
  <desc id="desc">Detect Markdown translation drift from Git history</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d21"/>
      <stop offset="1" stop-color="#30204f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="260" cy="170" r="130" fill="#8b5cf6" opacity=".12" filter="url(#glow)"/>

  <g transform="translate(82 68)">
    <rect x="18" y="8" width="166" height="204" rx="24" fill="#201536" stroke="#c4b5fd" stroke-opacity=".45"/>
    <rect x="92" y="30" width="166" height="204" rx="24" fill="#17243a" stroke="#67e8f9" stroke-opacity=".48"/>
    <text x="60" y="82" fill="#ede9fe" font-family="ui-serif, Georgia, serif" font-size="46" font-weight="700">A</text>
    <text x="200" y="102" fill="#cffafe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700" text-anchor="middle">文</text>
    <g fill="none" stroke-linecap="round">
      <path d="M46 116H128M46 142H144M46 168H112" stroke="#c4b5fd" stroke-opacity=".62" stroke-width="7"/>
      <path d="M122 140H226M122 166H214M122 192H238" stroke="#67e8f9" stroke-opacity=".62" stroke-width="7"/>
    </g>
    <circle cx="244" cy="212" r="30" fill="url(#accent)"/>
    <path d="M230 212L240 222 258 202" fill="none" stroke="#172033" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(410 74)">
    <text x="0" y="82" fill="#fafafa" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="68" font-weight="750" letter-spacing="-2.7">PolyglotGuard</text>
    <text x="2" y="130" fill="#ddd6fe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Detect Markdown translation drift from Git history</text>
    <g transform="translate(2 165)">
      <rect width="368" height="42" rx="21" fill="#ede9fe" fill-opacity=".07" stroke="#c4b5fd" stroke-opacity=".3"/>
      <circle cx="23" cy="21" r="5" fill="#fbbf24"/>
      <text x="42" y="27" fill="#ede9fe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1.25">DESIGN DRAFT · READ-ONLY v0.1</text>
    </g>
  </g>
